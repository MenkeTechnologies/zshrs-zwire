[package]
name = "zwire"
version = "0.3.1"
edition = "2021"
publish = false
description = "Native zshrs plugin: the whole zgui automation bus as a shell builtin"
authors = ["MenkeTechnologies"]
repository = "https://github.com/MenkeTechnologies/zshrs-zwire"
homepage = "https://github.com/MenkeTechnologies/zshrs-zwire"

[lib]
name = "zwire"
crate-type = ["cdylib", "rlib"]

[dependencies]
znative = "0.12"
serde_json = "1"
# Same decoder the host encodes with: PTY output and `fs read` cross the JSON
# pipe as base64, and a shell wants the bytes.
base64 = "0.22"
